<style>
input.field-missing,
select.field-missing,
input.field-missing:focus,
select.field-missing:focus {
    border-color: #F85149 !important;
    box-shadow: 0 0 0 1px #F85149;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('memberForm');
    const submitBtn = document.getElementById('submitBtn');
    const namePart = /^[A-Za-z]{4,49}$/;
    const lastNameShape = /^(?:[A-Za-z]{2,})(?: [A-Za-z]{2,})*$/;
    function lastNameOk(value) {
        const text = String(value || '').trim().replace(/ +/g, ' ');
        if (!lastNameShape.test(text)) return false;
        const letters = text.replace(/ /g, '');
        return letters.length >= 4 && letters.length <= 49;
    }

    const phoneInput = document.getElementById('phone_number');
    if (phoneInput) {
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 15) {
                value = value.substring(0, 15);
            }
            e.target.value = value;
        });
    }

    function keepLettersOnly(input) {
        if (!input) return;
        input.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^A-Za-z]/g, '').slice(0, 49);
        });
    }
    keepLettersOnly(document.getElementById('first_name'));
    const lastNameInput = document.getElementById('last_name');
    if (lastNameInput) {
        lastNameInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^A-Za-z ]/g, '').replace(/ {2,}/g, ' ').replace(/^ /, '');
            e.target.value = value.slice(0, 49);
        });
    }

    const zoneSelect = document.getElementById('zone_id');
    const sectorInput = document.getElementById('sector_number');
    if (zoneSelect && sectorInput) {
        zoneSelect.addEventListener('change', function() {
            const selectedOption = zoneSelect.options[zoneSelect.selectedIndex];
            const sectorNumber = selectedOption ? selectedOption.getAttribute('data-sector') : '';
            if (sectorNumber !== null && sectorNumber !== undefined && sectorNumber !== '') {
                sectorInput.value = sectorNumber;
            } else {
                sectorInput.value = '';
            }
        });
        if (zoneSelect.value) {
            zoneSelect.dispatchEvent(new Event('change'));
        }
    }

    const districtSelect = document.getElementById('district');
    const provinceInput = document.getElementById('province');
    function syncProvince() {
        if (!districtSelect || !provinceInput) return;
        const option = districtSelect.options[districtSelect.selectedIndex];
        provinceInput.value = option ? (option.getAttribute('data-province') || '') : '';
    }
    if (districtSelect) {
        districtSelect.addEventListener('change', syncProvince);
        syncProvince();
    }

    function markMissing(el, missing) {
        if (!el) return;
        el.classList.toggle('field-missing', !!missing);
    }
    function refreshMissing() {
        const first = document.getElementById('first_name');
        const last = document.getElementById('last_name');
        markMissing(first, !first || !namePart.test((first.value || '').trim()));
        markMissing(last, !last || !lastNameOk(last.value));
        const gender = document.getElementById('gender');
        markMissing(gender, !gender || !gender.value);
        const phone = document.getElementById('phone_number');
        markMissing(phone, !phone || !/^[0-9]{9,15}$/.test(phone.value || ''));
        markMissing(districtSelect, !districtSelect || !districtSelect.value);
        markMissing(provinceInput, !provinceInput || !String(provinceInput.value || '').trim());
        const branch = document.getElementById('branch_name');
        markMissing(branch, !branch || !String(branch.value || '').trim());
        const category = document.getElementById('cell_category_label');
        markMissing(category, !category || !String(category.value || '').trim());
        if (zoneSelect && zoneSelect.getAttribute('data-zone-required') === '1') {
            markMissing(zoneSelect, !zoneSelect.value);
            markMissing(sectorInput, !sectorInput || !String(sectorInput.value || '').trim());
        }
    }
    if (form) {
        form.addEventListener('input', refreshMissing);
        form.addEventListener('change', refreshMissing);
    }
    refreshMissing();

    if (form) {
        form.addEventListener('submit', function(e) {
            function stop(message, el) {
                e.preventDefault();
                alert(message);
                if (el) el.focus();
            }
            const first = document.getElementById('first_name');
            const last = document.getElementById('last_name');
            if (!first || !namePart.test(first.value.trim())) {
                stop('First name must be more than 3 letters, with no numbers or spaces.', first);
                return;
            }
            if (!last || !lastNameOk(last.value)) {
                stop('Last name must be more than 3 letters in total. Each word must be at least 2 letters, with a single space between words.', last);
                return;
            }
            const age = document.getElementById('age');
            if (age && age.value && (Number(age.value) < 1 || Number(age.value) > 120)) {
                stop('Please enter a valid age between 1 and 120.', age);
                return;
            }
            const gender = document.getElementById('gender');
            if (!gender || !gender.value) {
                stop('Gender is required.', gender);
                return;
            }
            const phone = document.getElementById('phone_number');
            if (!phone || !/^[0-9]{9,15}$/.test(phone.value)) {
                stop('Please enter a valid phone number (9-15 digits).', phone);
                return;
            }
            const cellCategory = document.getElementById('cell_category');
            if (!cellCategory || !cellCategory.value) {
                stop('Cell leader has no cell category', cellCategory);
                return;
            }
            const district = document.getElementById('district');
            if (!district || !district.value) {
                stop('Pick a district from the list.', district);
                return;
            }
            if (zoneSelect && zoneSelect.getAttribute('data-zone-required') === '1' && !zoneSelect.value) {
                stop('Please select a zone (required for Miracle Dome branch).', zoneSelect);
                return;
            }
            if (sectorInput && zoneSelect && !String(sectorInput.value).trim()) {
                stop('Sector is required for Miracle Dome branch.', zoneSelect);
                return;
            }
            if (submitBtn) {
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving...';
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.7';
                setTimeout(function() {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                }, 15000);
            }
        });
    }
});
</script>
